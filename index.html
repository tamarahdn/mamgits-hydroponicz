    background-size: cover;
    background-position: center;
    font-family:'Quicksand', sans-serif;
    color:var(--ink);
    padding:24px;
  }

  .app{
    width:100%;
    max-width:420px;
    background:rgba(255,255,255,0.97);
    border-radius:32px;
    box-shadow: 0 20px 50px rgba(20,40,20,0.22);
    padding:28px 26px 24px;
    position:relative;
    overflow:hidden;
  }

  .app::before{
    content:"";
    position:absolute;
    top:-60px; right:-60px;
    width:180px; height:180px;
    background:radial-gradient(circle, var(--amber) 0%, transparent 70%);
    opacity:.35;
    filter:blur(4px);
    pointer-events:none;
    transition:opacity .6s ease;
  }
  .app.break::before{ opacity:.15; }

  .eyebrow{
    font-family:'Fredoka', sans-serif;
    font-size:17px;
    letter-spacing:.01em;
    color:var(--leaf-dark);
    text-align:center;
    margin-bottom:4px;
    font-weight:600;
  }

  .phase-label{
    text-align:center;
    font-size:15px;
    color:var(--water-deep);
    font-weight:600;
    margin-bottom:10px;
    min-height:20px;
    transition:color .4s ease;
  }
  .app.break .phase-label{ color:var(--clay-dark); }

  .timer{
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    font-size:64px;
    text-align:center;
    line-height:1;
    letter-spacing:.01em;
    margin-bottom:4px;
    font-variant-numeric: tabular-nums;
  }

  .sub{
    text-align:center;
    font-size:13px;
    color:var(--ink-soft);
    margin-bottom:18px;
  }

  /* ---- Hydroponic tower ---- */
  .tower-wrap{
    display:flex;
    justify-content:center;
    margin: 118px 0 14px;
  }

  .tower{
    position:relative;
    width:210px;
    height:238px;
  }

  .grow-light{
    position:absolute;
    top:-14px; left:50%;
    transform:translateX(-50%);
    width:150px; height:16px;
    border-radius:10px;
    background: linear-gradient(90deg, transparent, var(--amber), transparent);
    opacity:.55;
    filter:blur(3px);
    animation: lightPulse 3.2s ease-in-out infinite;
  }
  @keyframes lightPulse{
    0%,100%{opacity:.35; transform:translateX(-50%) scaleX(.92);}
    50%{opacity:.7; transform:translateX(-50%) scaleX(1);}
  }
  .app.break .grow-light{ animation-duration:6s; opacity:.25; }
  .app.paused .grow-light{ animation-play-state:paused; }

  .tube{
    position:absolute;
    top:14px; left:50%;
    transform:translateX(-50%);
    width:104px; height:210px;
    border-radius:52px;
    background: linear-gradient(180deg, var(--glass) 0%, #EFF9F7 100%);
    border:3px solid #DCEDEA;
    box-shadow: inset 0 0 0 3px rgba(255,255,255,.6), 0 10px 20px rgba(74,158,154,.12);
    overflow:hidden;
  }

  .water{
    position:absolute;
    left:0; right:0; bottom:0;
    height:62%;
    background: linear-gradient(180deg, var(--water) 0%, var(--water-deep) 100%);
    border-radius: 0 0 48px 48px;
    transition: height 1s ease;
  }
  .water::before{
    content:"";
    position:absolute;
    top:-6px; left:0; right:0; height:14px;
    background: radial-gradient(ellipse at 30% 50%, rgba(255,255,255,.5), transparent 60%),
                radial-gradient(ellipse at 70% 50%, rgba(255,255,255,.35), transparent 60%);
    animation: ripple 2.4s ease-in-out infinite;
  }
  @keyframes ripple{
    0%,100%{transform:translateX(0);}
    50%{transform:translateX(3px);}
  }

  .bubble{
    position:absolute;
    bottom:4px;
    width:5px; height:5px;
    border-radius:50%;
    background:rgba(255,255,255,.75);
    animation: rise 2.6s linear infinite;
  }
  .app.paused .bubble{ animation-play-state:paused; }
  .bubble:nth-child(1){ left:30%; animation-delay:.1s; }
  .bubble:nth-child(2){ left:50%; width:4px; height:4px; animation-delay:.9s; }
  .bubble:nth-child(3){ left:65%; animation-delay:1.6s; }
  .bubble:nth-child(4){ left:42%; width:3px; height:3px; animation-delay:2.1s; }
  @keyframes rise{
    0%{ transform:translateY(0) scale(1); opacity:.9; }
    90%{ opacity:.7; }
    100%{ transform:translateY(-120px) scale(1.3); opacity:0; }
  }

  .roots{
    position:absolute;
    bottom:8px; left:50%;
    transform:translateX(-50%);
    width:70px; height:40px;
    opacity:.55;
  }
  .roots svg{ width:100%; height:100%; }
  .roots path{
    stroke:var(--paper);
    stroke-width:2;
    fill:none;
    stroke-linecap:round;
    animation: sway 3.6s ease-in-out infinite;
    transform-origin: top center;
  }
  .app.paused .roots path{ animation-play-state:paused; }

  /* ---- gardener character ---- */
  .gardener{
    position:absolute;
    top:-101px;
    left:50%;
    width:96px;
    height:119px;
    transform: translateX(-50%) rotate(-2deg);
    z-index:6;
    transition: transform .6s ease, opacity .6s ease;
    filter: drop-shadow(0 6px 8px rgba(43,58,58,.10));
  }
  .app.break .gardener{
    transform: translateX(-50%) rotate(-2deg) translateY(4px);
  }
  .gardener svg{ width:100%; height:100%; }

  .g-can-arm{
    animation: canTip 2.8s ease-in-out infinite;
    transform-box: view-box;
    transform-origin: 50px 60px;
  }
  .app.paused .g-can-arm{ animation-play-state:paused; }
  .app.break .g-can-arm{ animation:none; transform: rotate(-7deg); }
  @keyframes canTip{
    0%,100%{ transform: rotate(-3deg); }
    50%{ transform: rotate(5deg); }
  }

  .pour{
    position:absolute;
    top:2px;
    left:50%;
    transform:translateX(-50%);
    width:16px;
    height:36px;
    z-index:5;
    pointer-events:none;
  }
  .app.break .pour{ opacity:0; }
  .drop{
    position:absolute;
    top:0; left:8px;
    width:4px; height:8px;
    border-radius:50% 50% 50% 50% / 60% 60% 40% 40%;
    background: linear-gradient(180deg, #BFE8E4, var(--water-deep));
    opacity:0;
    animation: fall 1.4s ease-in infinite;
  }
  .app.paused .drop{ animation-play-state:paused; }
  .drop:nth-child(1){ animation-delay:0s; left:5px; }
  .drop:nth-child(2){ animation-delay:.45s; left:11px; }
  .drop:nth-child(3){ animation-delay:.9s; left:8px; }
  @keyframes fall{
    0%{ transform:translateY(0); opacity:0; }
    15%{ opacity:1; }
    85%{ opacity:.9; }
    100%{ transform:translateY(38px); opacity:0; }
  }

  .pods{
    position:absolute;
    top:6px; left:50%;
    transform:translateX(-50%);
    width:120px;
    display:flex;
    justify-content:space-between;
  }

  .pod{
    position:relative;
    width:30px; height:210px;
  }

  .net-cup{
    position:absolute;
    bottom:34%;
    left:50%;
    transform:translateX(-50%);
    width:26px; height:14px;
    background: var(--clay);
    border-radius:4px 4px 8px 8px;
    box-shadow: inset 0 -2px 0 rgba(0,0,0,.08);
    z-index:3;
  }

  .plant{
    position:absolute;
    bottom:calc(34% + 10px);
    left:50%;
    transform:translateX(-50%);
    width:40px;
    height:0px;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:flex-end;
    z-index:2;
    transition: height 1s ease;
  }

  .stem{
    width:3px;
    background: var(--leaf-dark);
    border-radius:2px;
    height:100%;
    transition: height 1s ease;
  }

  .leaf-set{
    position:absolute;
    width:100%;
    display:flex;
    justify-content:center;
    opacity:0;
    transition: opacity .6s ease, transform .6s ease;
  }
  .leaf-set span{
    display:inline-block;
    width:16px; height:9px;
    background: var(--leaf);
    border-radius:0 60% 0 60%;
    margin:0 -3px;
  }
  .leaf-set span:last-child{
    transform: scaleX(-1);
  }

  .veg{
    position:absolute;
    top:-12px; left:50%;
    transform:translateX(-50%) scale(0);
    width:18px; height:16px;
    border-radius:50% 50% 45% 45%;
    background: radial-gradient(circle at 35% 30%, #F3846A, #D8492F);
    opacity:0;
    transition: transform .7s cubic-bezier(.34,1.56,.64,1), opacity .5s ease;
    box-shadow: 0 0 0 2px rgba(216,73,47,.18);
  }
  .veg::before{
    content:"";
    position:absolute;
    top:-5px; left:50%;
    transform:translateX(-50%);
    width:10px; height:7px;
    background: var(--leaf);
    border-radius:0 60% 0 60%;
  }
  .veg::after{
    content:"";
    position:absolute;
    top:-6px; left:50%;
    transform:translateX(-50%) rotate(90deg);
    width:10px; height:7px;
    background: var(--leaf);
    border-radius:0 60% 0 60%;
  }

  /* growth stages via data-stage 0..4 */
  .plant[data-stage="0"]{ height:0px; }
  .plant[data-stage="1"]{ height:18px; }
  .plant[data-stage="1"] .leaf-set.l1{ opacity:1; bottom:2px; }
  .plant[data-stage="2"]{ height:44px; }
  .plant[data-stage="2"] .leaf-set.l1{ opacity:1; bottom:8px; }
  .plant[data-stage="2"] .leaf-set.l2{ opacity:1; bottom:26px; }
  .plant[data-stage="3"]{ height:70px; }
  .plant[data-stage="3"] .leaf-set.l1{ opacity:1; bottom:10px; }
  .plant[data-stage="3"] .leaf-set.l2{ opacity:1; bottom:32px; }
  .plant[data-stage="3"] .leaf-set.l3{ opacity:1; bottom:52px; }
  .plant[data-stage="4"]{ height:82px; }
  .plant[data-stage="4"] .leaf-set.l1{ opacity:1; bottom:10px; }
  .plant[data-stage="4"] .leaf-set.l2{ opacity:1; bottom:32px; }
  .plant[data-stage="4"] .leaf-set.l3{ opacity:1; bottom:54px; }
  .plant[data-stage="4"] .veg{ opacity:1; transform:translateX(-50%) scale(1); }

  .pod.inactive .plant{ opacity:.28; }

  /* ---- progress dots ---- */
  .dots{
    display:flex;
    justify-content:center;
    gap:8px;
    margin-bottom:18px;
  }
  .dot{
    width:9px; height:9px;
    border-radius:50%;
    background: #DDEAE6;
    transition: background .4s ease, transform .3s ease;
  }
  .dot.done{ background: var(--leaf); }
  .dot.current{ background: var(--water-deep); transform:scale(1.3); }

  /* ---- breathing ring (break mode) ---- */
  .breathe{
    display:none;
    justify-content:center;
    align-items:center;
    margin: 4px 0 16px;
  }
  .app.break .breathe{ display:flex; }
  .app.break .tower-wrap{ display:none; }
  .app.break .dots{ display:none; }

  .breathe-ring{
    width:120px; height:120px;
    border-radius:50%;
    background: radial-gradient(circle, rgba(227,165,124,.35), rgba(227,165,124,.05) 70%);
    border:2px solid var(--clay);
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    font-size:13px;
    font-weight:600;
    color:var(--clay-dark);
    animation: breathe 8s ease-in-out infinite;
  }
  .app.paused .breathe-ring{ animation-play-state:paused; }
  @keyframes breathe{
    0%,100%{ transform:scale(.82); }
    50%{ transform:scale(1.05); }
  }

  /* ---- controls ---- */
  .controls{
    display:flex;
    gap:10px;
    margin-bottom:6px;
  }
  button{
    font-family:'Quicksand', sans-serif;
    font-weight:600;
    font-size:14px;
    border:none;
    border-radius:14px;
    padding:12px 0;
    cursor:pointer;
    transition: transform .15s ease, box-shadow .15s ease, background .2s ease;
  }
  button:active{ transform:scale(.96); }

  .btn-primary{
    flex:1.4;
    background: linear-gradient(180deg, var(--leaf), var(--leaf-dark));
    color:white;
    box-shadow: 0 6px 14px rgba(63,122,74,.25);
  }
  .btn-primary.is-pause{
    background: linear-gradient(180deg, #E9B26B, var(--clay-dark));
    box-shadow: 0 6px 14px rgba(199,127,82,.25);
  }
  .btn-secondary{
    flex:1;
    background: var(--mist-2);
    color: var(--ink-soft);
  }
  .btn-icon{
    width:44px; flex:none;
    background: var(--mist-2);
    color: var(--ink-soft);
    font-size:16px;
  }

  .sessions-tally{
    text-align:center;
    font-size:12px;
    color:var(--ink-soft);
    margin-top:12px;
  }

  /* ---- settings panel ---- */
  .settings{
    max-height:0;
    overflow:hidden;
    transition: max-height .4s ease, margin-top .4s ease;
    margin-top:0;
  }
  .settings.open{
    max-height:320px;
    margin-top:16px;
  }
  .settings-inner{
    background: var(--mist);
    border-radius:18px;
    padding:16px 16px 6px;
  }
  .field{
    margin-bottom:14px;
  }
  .field-row{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    font-weight:600;
    color:var(--ink);
    margin-bottom:6px;
  }
  .field-row span.val{ color:var(--water-deep); }
  input[type="range"]{
    width:100%;
    accent-color: var(--water-deep);
  }
  .rounds-picker{
    display:flex;
    gap:8px;
  }
  .rounds-picker button{
    flex:1;
    padding:8px 0;
    background:white;
    color:var(--ink-soft);
    font-size:13px;
    border:1.5px solid #DCEDEA;
  }
  .rounds-picker button.active{
    background: var(--water-deep);
    color:white;
    border-color:var(--water-deep);
  }

  .hint{
    text-align:center;
    font-size:11px;
    color:var(--ink-soft);
    opacity:.8;
    margin-top:14px;
    line-height:1.5;
  }

  .btn-endday{
    display:block;
    width:100%;
    margin-top:10px;
    background:none;
    border:1.5px dashed #DCEDEA;
    color:var(--ink-soft);
    font-family:'Quicksand', sans-serif;
    font-weight:600;
    font-size:12px;
    border-radius:14px;
    padding:9px 0;
    cursor:pointer;
  }
  .btn-endday:active{ transform:scale(.97); }

  .recap{
    display:none;
    position:absolute;
    inset:0;
    background:rgba(255,255,255,.97);
    border-radius:32px;
    align-items:center;
    justify-content:center;
    z-index:20;
  }
  .recap.open{ display:flex; }
  .recap-card{
    width:100%;
    padding:0 26px;
    text-align:center;
  }
  .recap-title{
    font-family:'Fredoka', sans-serif;
    font-size:15px;
    color:var(--ink-soft);
    text-transform:lowercase;
    margin-bottom:6px;
  }
  .recap-count{
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    font-size:56px;
    color:var(--leaf-dark);
    line-height:1;
  }
  .recap-sub{
    font-size:13px;
    color:var(--ink-soft);
    margin-bottom:14px;
  }
  .recap-tomato, .harvest-tomato{
    position:relative;
    width:56px; height:52px;
    margin:0 auto 10px;
  }
  .recap-tomato-body, .harvest-tomato-body{
    position:absolute;
    bottom:0; left:0;
    width:56px; height:44px;
    border-radius:50% 50% 46% 46%;
    background: radial-gradient(circle at 35% 30%, #F3846A, #D8492F);
    box-shadow: 0 0 0 2px rgba(216,73,47,.15);
  }
  .recap-tomato-leaf, .harvest-tomato-leaf{
    position:absolute;
    top:0; left:50%;
    width:20px; height:14px;
    background: var(--leaf);
    border-radius:0 60% 0 60%;
  }
  .recap-tomato-leaf.l1, .harvest-tomato-leaf.l1{ transform:translateX(-90%) rotate(-8deg); }
  .recap-tomato-leaf.l2, .harvest-tomato-leaf.l2{ transform:translateX(-10%) rotate(98deg); }

  .harvest-confirm{
    display:none;
    flex-direction:column;
    align-items:center;
    margin: 8px 0 4px;
  }
  .app.harvestready .harvest-confirm{ display:flex; }
  .app.harvestready .breathe{ display:none; }
  .app.harvestready .controls{ display:none; }
  .harvest-confirm-title{
    font-family:'Fredoka', sans-serif;
    font-size:16px;
    font-weight:600;
    color:var(--leaf-dark);
    margin-bottom:14px;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.2s !important; }
  }
</style>
</head>

      </div>
      <div class="recap-title">today's harvest</div>
      <div class="recap-count" id="recapCount">0</div>
      <div class="recap-sub" id="recapSub">pods grown</div>
      <button class="btn-primary" id="recapCloseBtn" style="width:100%;">start a new day</button>
    </div>
  </div>
</div>

<script>
(function(){
  const appEl = document.getElementById('app');
  const timerDisplay = document.getElementById('timerDisplay');
  const phaseLabel = document.getElementById('phaseLabel');
  const subLabel = document.getElementById('subLabel');
  const startBtn = document.getElementById('startBtn');
  const resetBtn = document.getElementById('resetBtn');
  const settingsBtn = document.getElementById('settingsBtn');
  const settingsPanel = document.getElementById('settingsPanel');
  const podsEl = document.getElementById('pods');
  const dotsEl = document.getElementById('dots');
  const waterEl = document.getElementById('water');
  const tallyEl = document.getElementById('tally');

  const breakRange = document.getElementById('breakRange');
  const breakVal = document.getElementById('breakVal');
  const roundsPicker = document.getElementById('roundsPicker');
  const roundsVal = document.getElementById('roundsVal');
  const enddayBtn = document.getElementById('enddayBtn');
  const recapOverlay = document.getElementById('recapOverlay');
  const recapCount = document.getElementById('recapCount');
  const recapSub = document.getElementById('recapSub');
  const recapCloseBtn = document.getElementById('recapCloseBtn');
  const harvestBtn = document.getElementById('harvestBtn');
  const harvestCount = document.getElementById('harvestCount');

  const FOCUS_MIN_PER_POD = 25;
  let settings = { rounds: 1, breakMin: 15 };
  let state = {
    phase: 'focus',     // 'focus' | 'break'
    running: false,
    podIndex: 0,        // which pod (0-based) is currently growing
    secondsLeft: FOCUS_MIN_PER_POD * 60,
    targetTime: null,   // wall-clock timestamp the current countdown ends at
    totalPodsGrownToday: 0
  };
  let tickHandle = null;

  function buildPods(){
    podsEl.innerHTML = '';
    dotsEl.innerHTML = '';
    for(let i=0;i<settings.rounds;i++){
      const pod = document.createElement('div');
      pod.className = 'pod inactive';
      pod.id = 'pod-'+i;
      pod.innerHTML = `
        <div class="net-cup"></div>
        <div class="plant" data-stage="0" id="plant-${i}">
          <div class="veg"></div>
          <div class="leaf-set l3"><span></span><span></span></div>
          <div class="leaf-set l2"><span></span><span></span></div>
          <div class="leaf-set l1"><span></span><span></span></div>
          <div class="stem"></div>
        </div>`;
      podsEl.appendChild(pod);

      const dot = document.createElement('div');
      dot.className = 'dot';
      dot.id = 'dot-'+i;
      dotsEl.appendChild(dot);
    }
    updatePodVisualStates();
  }

  function updatePodVisualStates(){
    for(let i=0;i<settings.rounds;i++){
      const pod = document.getElementById('pod-'+i);
      const dot = document.getElementById('dot-'+i);
      if(!pod) continue;
      pod.classList.toggle('inactive', i !== state.podIndex && state.phase!=='break');
      dot.classList.remove('done','current');
      if(i < state.podIndex || (state.phase==='break' && i<=state.podIndex)){
        dot.classList.add('done');
      } else if(i === state.podIndex && state.phase==='focus'){
        dot.classList.add('current');
      }
    }
  }

  function stageForProgress(p){
    // p = fraction elapsed 0..1
    if(p >= 1) return 4;
    if(p > 0.66) return 3;
    if(p > 0.33) return 2;
    if(p > 0) return 1;
    return 0;
  }

  function fmt(s){
    const m = Math.floor(s/60).toString().padStart(2,'0');
    const sec = Math.floor(s%60).toString().padStart(2,'0');
    return m+':'+sec;
  }

  function totalSecondsForPhase(){
    return (state.phase==='focus' ? FOCUS_MIN_PER_POD : settings.breakMin) * 60;
  }

  function render(){
    timerDisplay.textContent = fmt(state.secondsLeft);
    appEl.classList.toggle('break', state.phase==='break');
    appEl.classList.toggle('harvestready', state.phase==='harvestready');
    appEl.classList.toggle('paused', !state.running);

    if(state.phase==='focus'){
      phaseLabel.textContent = settings.rounds>1 ? 'time to grow' : 'time to focus';
      subLabel.textContent = `pod ${state.podIndex+1} of ${settings.rounds}`;
      const total = FOCUS_MIN_PER_POD*60;
      const elapsed = total - state.secondsLeft;
      const p = elapsed/total;
      const stage = stageForProgress(p);
      const plant = document.getElementById('plant-'+state.podIndex);
      if(plant) plant.dataset.stage = stage;
      waterEl.style.height = (55 + p*10) + '%';
    } else if(state.phase==='break'){
      phaseLabel.textContent = 'istirahat tym';
      subLabel.textContent = 'stretching punggung jompo mu itu, drinki woter, NAPAS';
      waterEl.style.height = '58%';
    } else if(state.phase==='harvestready'){
      phaseLabel.textContent = 'break\'s done';
      subLabel.textContent = 'confirm the harvest when you\'re ready';
      harvestCount.textContent = settings.rounds;
    }

    startBtn.textContent = state.running ? 'Pause' : (state.secondsLeft < totalSecondsForPhase() ? 'Resume' : 'Start');
    startBtn.classList.toggle('is-pause', state.running);
    updatePodVisualStates();
    tallyEl.textContent = `${state.totalPodsGrownToday} pod${state.totalPodsGrownToday===1?'':'s'} grown today 🌱`;
  }

  let audioCtx = null;
  function getAudioCtx(){
    if(!audioCtx){
      const AC = window.AudioContext || window.webkitAudioContext;
      if(AC) audioCtx = new AC();
    }
    if(audioCtx && audioCtx.state === 'suspended'){
      audioCtx.resume().catch(()=>{});
    }
    return audioCtx;
  }
  function chime(){
    try{
      const ctx = getAudioCtx();
      if(!ctx) return;
      const notes = state.phase==='break' ? [523.25, 659.25, 783.99] : [659.25, 523.25];
      notes.forEach((freq, i)=>{
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.value = 0;
        osc.connect(gain); gain.connect(ctx.destination);
        const start = ctx.currentTime + i*0.18;
        gain.gain.linearRampToValueAtTime(0.16, start+0.03);
        gain.gain.exponentialRampToValueAtTime(0.001, start+0.6);
        osc.start(start);
        osc.stop(start+0.65);
        osc.onended = ()=>{ osc.disconnect(); gain.disconnect(); };
      });
    }catch(e){}
  }

  function notify(title, body){
    if(!('Notification' in window)) return;
    if(Notification.permission === 'granted'){
      try{ new Notification(title, { body }); }catch(e){}
    }
  }

  function requestNotifyPermission(){
    if('Notification' in window && Notification.permission === 'default'){
      Notification.requestPermission();
    }
  }

  function advancePhase(){
    chime();
    if(state.phase==='focus'){
      const plant = document.getElementById('plant-'+state.podIndex);
      if(plant) plant.dataset.stage = 4;

      if(state.podIndex < settings.rounds-1){
        state.podIndex++;
        state.phase='focus';
        state.secondsLeft = FOCUS_MIN_PER_POD*60;
        state.targetTime = Date.now() + state.secondsLeft*1000;
        notify('Pod ready 🌱', 'One hydro pod is grown — next one is sprouting.');
      } else {
        state.phase='break';
        state.secondsLeft = settings.breakMin*60;
        state.targetTime = Date.now() + state.secondsLeft*1000;
        notify('Time to stretch 🌿', 'Your hydro garden is grown. Breathe, stretch, sip some water.');
      }
    } else if(state.phase==='break'){
      state.phase='harvestready';
      state.running = false;
      state.targetTime = null;
      clearInterval(tickHandle);
      notify('Ready to harvest 🍅', 'Confirm the harvest whenever you\'re ready.');
    }
    render();
  }

  function tick(){
    if(!state.targetTime) return;
    const remaining = Math.round((state.targetTime - Date.now())/1000);
    state.secondsLeft = Math.max(0, remaining);
    if(state.secondsLeft <= 0){
      advancePhase();
      return;
    }
    render();
  }

  function start(){
    if(state.running) return;
    requestNotifyPermission();
    state.running = true;
    state.targetTime = Date.now() + state.secondsLeft*1000;
    tickHandle = setInterval(tick, 1000);
    render();
  }
  function pause(){
    state.running = false;
    state.targetTime = null;
    clearInterval(tickHandle);
    render();
  }
  function reset(){
    pause();
    state.phase='focus';
    state.podIndex=0;
    state.secondsLeft = FOCUS_MIN_PER_POD*60;
    buildPods();
    render();
  }

  // catch up instantly the moment the tab becomes visible again,
  // instead of waiting for the throttled interval to fire
  document.addEventListener('visibilitychange', ()=>{
    if(!document.hidden && state.running){
      tick();
    }
  });
  window.addEventListener('focus', ()=>{
    if(state.running) tick();
  });

  startBtn.addEventListener('click', ()=>{
    state.running ? pause() : start();
  });
  resetBtn.addEventListener('click', reset);
  settingsBtn.addEventListener('click', ()=>{
    settingsPanel.classList.toggle('open');
  });

  breakRange.addEventListener('input', ()=>{
    settings.breakMin = parseInt(breakRange.value,10);
    breakVal.textContent = settings.breakMin+' min';
  });
  roundsPicker.addEventListener('click', (e)=>{
    const btn = e.target.closest('button');
    if(!btn) return;
    [...roundsPicker.children].forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    settings.rounds = parseInt(btn.dataset.v,10);
    roundsVal.textContent = `${settings.rounds} pod${settings.rounds===1?'':'s'} · ${settings.rounds*FOCUS_MIN_PER_POD} min`;
    if(!state.running){ reset(); }
  });

  enddayBtn.addEventListener('click', ()=>{
    pause();
    const n = state.totalPodsGrownToday;
    recapCount.textContent = n;
    recapSub.textContent = `pod${n===1?'':'s'} grown`;
    recapOverlay.classList.add('open');
  });
  recapCloseBtn.addEventListener('click', ()=>{
    recapOverlay.classList.remove('open');
    state.totalPodsGrownToday = 0;
    reset();
  });

  harvestBtn.addEventListener('click', ()=>{
    state.totalPodsGrownToday += settings.rounds;
    state.phase = 'focus';
    state.podIndex = 0;
    state.secondsLeft = FOCUS_MIN_PER_POD*60;
    buildPods();
    start();
  });

  buildPods();
  render();
})();
</script>

</body>
</html>
